name: Build and Deploy Interview Agent to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# OIDC permissions required for Azure authentication
permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: "interviewagentacr2026hmk"
  ACR_LOGIN_SERVER: "interviewagentacr2026hmk.azurecr.io"
  BACKEND_IMAGE: "interviewagentacr2026hmk.azurecr.io/interview-agent-backend"
  FRONTEND_IMAGE: "interviewagentacr2026hmk.azurecr.io/interview-agent-frontend"
  NAMESPACE: "interview-agent"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Build & Push Backend ---
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Build & Push Frontend ---
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Connect to AKS ---
      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_AKS_RESOURCE_GROUP || vars.AZURE_AKS_RESOURCE_GROUP || 'interview-agent-rg' }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER_NAME || vars.AZURE_AKS_CLUSTER_NAME || 'interview-agent-aks' }}

      # --- Ensure Namespace & Secrets ---
      - name: Create or Update Kubernetes Namespace & Secrets
        run: |
          kubectl apply -f k8s/namespace.yaml

          # If GROQ_API_KEY secret is defined in GitHub, inject it dynamically without hardcoding
          if [ -n "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "Injecting production secrets from GitHub repository secrets..."
            kubectl create secret generic interview-agent-secrets \
              --namespace=${{ env.NAMESPACE }} \
              --from-literal=POSTGRES_USER=${{ secrets.POSTGRES_USER || 'postgres' }} \
              --from-literal=POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'postgres_password' }} \
              --from-literal=POSTGRES_DB=${{ secrets.POSTGRES_DB || 'interview_db' }} \
              --from-literal=JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY || 'SUPER_SECRET_JWT_KEY_CHANGE_THIS_IN_PRODUCTION_12345!' }} \
              --from-literal=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "Applying default k8s/secrets.yaml..."
            kubectl apply -f k8s/secrets.yaml
          fi

      # --- Deploy via Kustomize ---
      - name: Deploy Kubernetes Manifests
        run: |
          cd k8s
          # Set the exact commit SHA tags on both images
          kustomize edit set image ${{ env.BACKEND_IMAGE }}=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          kustomize edit set image ${{ env.FRONTEND_IMAGE }}=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          kubectl apply -k .

      # --- Verify Rollout Status ---
      - name: Verify Workload Rollouts
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          kubectl rollout status deployment/postgres -n ${{ env.NAMESPACE }} --timeout=180s

          echo "Waiting for Backend to be ready..."
          kubectl rollout status deployment/backend -n ${{ env.NAMESPACE }} --timeout=180s

          echo "Waiting for Frontend to be ready..."
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=180s

      # --- Output Public Service IP ---
      - name: Retrieve Public Application URL
        run: |
          echo "=== Fetching LoadBalancer External IP ==="
          for i in {1..30}; do
            EXTERNAL_IP=$(kubectl get svc frontend -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$EXTERNAL_IP" ]; then
              echo "================================================================"
              echo "🎉 SUCCESS: Interview Agent is accessible at: http://${EXTERNAL_IP}"
              echo "Swagger API Docs accessible at: http://${EXTERNAL_IP}/docs"
              echo "================================================================"
              exit 0
            fi
            echo "Waiting for Azure LoadBalancer public IP assignment ($i/30)..."
            sleep 10
          done
          echo "LoadBalancer IP pending. Run 'kubectl get svc frontend -n ${{ env.NAMESPACE }}' to inspect."
