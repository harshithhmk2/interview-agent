services:
  db:
    image: postgres:16-alpine
    container_name: interview-agent-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: interview_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: interview-agent-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-setup:
    image: curlimages/curl:8.6.0
    container_name: interview-agent-ollama-setup
    depends_on:
      - ollama
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        echo "Waiting for Ollama to be ready..."
        until curl -s -f http://ollama:11434/api/tags >/dev/null 2>&1; do
          sleep 2
        done
        echo "Ollama is ready. Pulling llama3 model..."
        curl -X POST http://ollama:11434/api/pull -d '{"name": "llama3"}'
        echo "Model llama3 pulled successfully."

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-agent-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres_password@db:5432/interview_db"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_BASE_URL: "${GROQ_BASE_URL:-https://api.groq.com/openai/v1}"
      LLM_PROVIDER: "${LLM_PROVIDER:-auto}"
      PLANNER_MODEL: "${PLANNER_MODEL:-openai/gpt-oss-120b}"
      EVALUATOR_MODEL: "${EVALUATOR_MODEL:-openai/gpt-oss-120b}"
      INTERVIEWER_MODEL: "${INTERVIEWER_MODEL:-openai/gpt-oss-20b}"
      REPORTER_MODEL: "${REPORTER_MODEL:-openai/gpt-oss-120b}"
      ENABLE_TTS: "${ENABLE_TTS:-False}"
      MOCK_LLM: "${MOCK_LLM:-False}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-SUPER_SECRET_JWT_KEY_CHANGE_THIS_IN_PRODUCTION_12345!}"
      AUDIO_OUTPUT_DIR: "/app/audio_outputs"
      LOG_LEVEL: "INFO"
    env_file:
      - .env
    volumes:
      - ./audio_outputs:/app/audio_outputs
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interview-agent-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
