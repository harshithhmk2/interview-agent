apiVersion: v1
kind: Secret
metadata:
  name: interview-agent-secrets
  namespace: interview-agent
  labels:
    app.kubernetes.io/part-of: ai-voice-interview-agent
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres_password"
  POSTGRES_DB: "interview_db"

  # Application Security
  JWT_SECRET_KEY: "SUPER_SECRET_JWT_KEY_CHANGE_THIS_IN_PRODUCTION_12345!"

  # Groq Cloud LLM API Key (Replace with your actual key or inject in CI/CD)
  GROQ_API_KEY: "YOUR_GROQ_API_KEY_HERE"
