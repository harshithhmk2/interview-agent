[tool.poetry]
name = "ai-voice-interview-agent"
version = "0.1.0"
description = "An AI-powered voice interviewer that screens candidates and generates reports."
authors = ["AI Voice Interview Agent Team <dev@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.1" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.31" }
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
pydantic = "^2.7.4"
pydantic-settings = "^2.3.4"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "^4.1.3"
python-multipart = "^0.0.9"
langgraph = "^0.1.4"
langchain-core = "^0.2.9"
langchain-community = "^0.2.5"
faiss-cpu = "^1.8.0"
fastembed = "^0.3.0"
pypdf = "^4.2.0"
python-docx = "^1.1.2"
httpx = "^0.27.0"
jinja2 = "^3.1.4"
alembic = "^1.13.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
aiosqlite = "^0.20.0"
black = "^24.4.2"
mypy = "^1.10.0"
flake8 = "^7.1.0"
types-python-jose = "^3.3.4.20240106"
types-passlib = "^1.7.7.20240327"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "passlib.*",
    "jose.*",
    "faiss.*",
    "docx.*",
    "pypdf.*",
    "alembic.*",
    "langgraph.*",
    "langchain_core.*",
    "langchain_community.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
